# Corpo do server HTTPS de cada dominio proprio de loja (ex: diamanteveiculos.com.br).
# Incluido pelos arquivos que scripts/dominios-proprios.sh gera em
# nginx/dominios/*.conf — cada um so define server_name e o certificado.
# Mesmas rotas do bloco HTTPS principal (nginx.conf); o backend e o SSR
# descobrem a loja pelo Host.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;

client_max_body_size 50M;

# Sem includeSubDomains: os outros subdominios sao da loja, nao nossos.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

location = /health {
    proxy_pass http://backend-cliente:8080/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 5s;
    access_log off;
}

location /api/ {
    proxy_pass http://backend-cliente:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /hubs/ {
    proxy_pass http://backend-cliente:8080/hubs/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
}

location /uploads/ {
    proxy_pass http://backend-cliente:8080/uploads/;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location / {
    proxy_pass http://frontend-ssr:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 30s;
    proxy_hide_header X-Powered-By;
}
