<div class="redefinir-container">
  <div class="redefinir-card">
    <div class="redefinir-header">
      <h1>Redefinir senha</h1>
      <p>Escolha a sua nova senha</p>
    </div>

    @if (!sucesso) {
      <form (ngSubmit)="redefinir()">
        <!-- Quem chega pelo link do e-mail ja trouxe o token na URL; mostrar
             o campo so daria a impressao de que falta preencher alguma coisa.
             Ele aparece apenas quando nao veio token nenhum — caso do e-mail
             que caiu no modo alternativo e mandou o codigo em vez do botao. -->
        @if (!tokenVeioDaUrl) {
          <div class="form-group">
            <label for="token">Código de recuperação</label>
            <input
              type="text"
              id="token"
              [(ngModel)]="token"
              name="token"
              placeholder="Cole aqui o código recebido por e-mail"
              [disabled]="loading" />
          </div>
        }

        <div class="form-group">
          <label for="novaSenha">Nova Senha</label>
          <input
            type="password"
            id="novaSenha"
            [(ngModel)]="novaSenha"
            name="novaSenha"
            placeholder="Mínimo de 6 caracteres"
            [disabled]="loading"
            autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar Senha</label>
          <input
            type="password"
            id="confirmarSenha"
            [(ngModel)]="confirmarSenha"
            name="confirmarSenha"
            placeholder="Repita a nova senha"
            [disabled]="loading"
            autocomplete="new-password" />
        </div>

        @if (erro) {
          <div class="error-message">{{ erro }}</div>
        }

        <button type="submit" class="btn-primary" [disabled]="loading">
          @if (loading) {
            <span>Redefinindo…</span>
          } @else {
            <span>Redefinir Senha</span>
          }
        </button>
      </form>
    } @else {
      <div class="success-message">
        <span class="material-icons">check_circle</span>
        <p>{{ mensagem }}</p>
        <p class="redirect-msg">Redirecionando para o login…</p>
      </div>
    }

    <div class="redefinir-footer">
      <a routerLink="/login">Voltar para o login</a>
    </div>
  </div>
</div>
